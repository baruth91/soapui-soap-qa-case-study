name: SOAP contract and transfer integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soapui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Check generated contract and portable project
        run: |
          python scripts/build_project.py
          git diff --exit-code -- service/accounts.wsdl soapui/accounts-soapui-project.xml
      - name: Run actual SoapUI baseline against the Java service
        run: python scripts/run.py
      - name: Prove detection of the missing-debit defect
        run: python scripts/check_mutation.py
      - name: Upload test evidence without JVM properties
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: soapui-transfer-evidence
          path: reports/
          if-no-files-found: warn
          retention-days: 7
